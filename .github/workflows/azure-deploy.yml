name: Deploy ContentOS to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  AZURE_WEBAPP_NAME: ContentOS
  AZURE_RESOURCE_GROUP: azureai

jobs:
  build-and-deploy:
    name: Build and Deploy to Azure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies & create deployment package
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt --target backend/.python_packages/lib/site-packages

      - name: Zip backend for deployment
        run: |
          cd backend
          zip -r ../deploy.zip . -x "venv/*" -x ".env" -x "__pycache__/*" -x "*.pyc"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set App Settings in Azure
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az webapp config appsettings set \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --settings \
                GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
                PINECONE_API_KEY="${{ secrets.PINECONE_API_KEY }}" \
                PINECONE_INDEX_NAME="${{ secrets.PINECONE_INDEX_NAME }}" \
                GROQ_MODEL="${{ secrets.GROQ_MODEL }}" \
                SCM_DO_BUILD_DURING_DEPLOYMENT="false" \
                WEBSITE_RUN_FROM_PACKAGE="0"

      - name: Set Startup Command
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az webapp config set \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --startup-file "gunicorn -w 2 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:8000 --timeout 120"

      - name: Deploy ZIP to Azure App Service
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az webapp deploy \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --src-path deploy.zip \
              --type zip \
              --async false
